import io
import base64
from PIL import Image

IMGBB_KEY = os.environ.get("IMGBB_API_KEY")

def adjust_and_upload_image(image_url):
    """فحص أبعاد الصورة وضبطها تلقائياً لتتوافق مع معايير إنستجرام"""
    try:
        resp = requests.get(image_url, timeout=20, verify=False)
        img = Image.open(io.BytesIO(resp.content)).convert("RGB")
        w, h = img.size
        ratio = w / h

        # النسبة المقبولة لدى إنستجرام بين 0.8 و 1.91
        if 0.8 <= ratio <= 1.91:
            return image_url

        # ضبط الصورة داخل إطار مربع متناسق بخلفية بيضاء
        max_side = max(w, h)
        new_img = Image.new("RGB", (max_side, max_side), (255, 255, 255))
        offset = ((max_side - w) // 2, (max_side - h) // 2)
        new_img.paste(img, offset)

        buffer = io.BytesIO()
        new_img.save(buffer, format="JPEG", quality=90)
        img_b64 = base64.b64encode(buffer.getvalue()).decode("utf-8")

        if IMGBB_KEY:
            up_res = requests.post(
                "https://api.imgbb.com/1/upload",
                data={"key": IMGBB_KEY, "image": img_b64},
                timeout=20
            ).json()
            if up_res.get("success"):
                return up_res["data"]["url"]

    except Exception as e:
        print(f"تنبيه معالجة الصورة: {e}")

    return image_url

def post_to_instagram(image_url, caption):
    if not image_url:
        return None

    final_image_url = adjust_and_upload_image(image_url)

