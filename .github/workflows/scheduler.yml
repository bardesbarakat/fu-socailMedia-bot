import base64
import io
import os
import time
from PIL import Image
import requests

IMGBB_KEY = os.environ.get("IMGBB_API_KEY")


def adjust_and_upload_image(image_url):
  """فحص أبعاد الصورة وضبطها تلقائياً لتتوافق مع معايير إنستجرام ثم رفعها عبر ImgBB."""
  try:
    # تحميل الصورة مع Headers تحسباً لحظر الـ User-Agent
    headers = {"User-Agent": "Mozilla/5.0"}
    resp = requests.get(
        image_url, headers=headers, timeout=20, verify=False
    )
    if resp.status_code != 200:
      print(
          f"فشل تحميل الصورة من الموقع: رمز الحالة {resp.status_code}"
      )
      return image_url

    img = Image.open(io.BytesIO(resp.content)).convert("RGB")
    w, h = img.size
    ratio = w / h

    # إنستجرام يشترط:
    # 1. النسبة تكون بين 0.8 (4:5) و 1.91 (1.91:1)
    # 2. العرض يكون 320 بكسل على الأقل
    if 0.8 <= ratio <= 1.91 and w >= 320:
      return image_url

    # إذا كانت النسبة غير متوافقة، يتم وضعها داخل قالب مربع بنسبة 1:1 بخلفية بيضاء
    # مع ضمان أن طول الضلع لا يقل عن 600 بكسل لتوافق متطلبات إنستجرام
    max_side = max(w, h, 600)
    new_img = Image.new("RGB", (max_side, max_side), (255, 255, 255))
    offset = ((max_side - w) // 2, (max_side - h) // 2)
    new_img.paste(img, offset)

    # حفظ الصورة المضبوطة كـ JPEG في الذاكرة
    buffer = io.BytesIO()
    new_img.save(buffer, format="JPEG", quality=92)
    img_b64 = base64.b64encode(buffer.getvalue()).decode("utf-8")

    if IMGBB_KEY:
      up_res = requests.post(
          "https://api.imgbb.com/1/upload",
          data={"key": IMGBB_KEY, "image": img_b64},
          timeout=25,
      ).json()
      if up_res.get("success"):
        hosted_url = up_res["data"]["url"]
        print(f"تم تعديل ورفع الصورة بنجاح: {hosted_url}")
        return hosted_url
      else:
        print(f"فشل الرفع إلى ImgBB: {up_res}")
    else:
      print("تنبيه: مفتاح IMGBB_API_KEY غير موجود في المتغيرات.")

  except Exception as e:
    print(f"تنبيه معالجة الصورة: {e}")

  return image_url


def post_to_instagram(image_url, caption):
  if not image_url:
    return None

  final_image_url = adjust_and_upload_image(image_url)

  container_url = f"https://graph.facebook.com/v19.0/{IG_USER_ID}/media"
  container_payload = {
      "image_url": final_image_url,
      "caption": caption,
      "access_token": ACCESS_TOKEN,
  }
  c_res = requests.post(container_url, data=container_payload).json()
  creation_id = c_res.get("id")
  if not creation_id:
    print(f"خطأ حاوية إنستجرام: {c_res}")
    return c_res

  time.sleep(5)
  publish_url = f"https://graph.facebook.com/v19.0/{IG_USER_ID}/media_publish"
  return requests.post(
      publish_url,
      data={"creation_id": creation_id, "access_token": ACCESS_TOKEN},
  ).json()
