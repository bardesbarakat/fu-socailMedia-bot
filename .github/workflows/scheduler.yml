name: University News Bot Scheduler

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'اختر المنصة:'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - facebook
          - instagram

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run News Bot
        env:
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          TARGET_PLATFORM: ${{ github.event.inputs.target_platform || 'all' }}
        run: python bot.py

      - name: Commit and Push History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch posted_news.txt
          git add posted_news.txt
          git diff --staged --quiet || (git commit -m "Update posted_news.txt" && git pull --rebase origin main && git push)
